name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: bloglist_backend
    env:
      PORT: 3003
      SECRET: ci-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/blogapp_ci
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/blogapp_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bloglist_backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend Lint, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloglist_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bloglist_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: 3003
      SECRET: ci-secret
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/blogapp_ci
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/blogapp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            bloglist_backend/package-lock.json
            bloglist_frontend/package-lock.json
            bloglist_e2e_tests/package-lock.json

      - name: Install backend dependencies
        working-directory: bloglist_backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: bloglist_frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: bloglist_e2e_tests
        run: npm ci

      - name: Install Playwright browser
        working-directory: bloglist_e2e_tests
        run: npx playwright install --with-deps chromium

      - name: Start backend in test mode
        working-directory: bloglist_backend
        run: npm run start:test &

      - name: Start frontend dev server
        working-directory: bloglist_frontend
        run: npm run dev -- --host 127.0.0.1 --port 5173 &

      - name: Wait for services
        run: npx wait-on@7 http://127.0.0.1:3003/api/users http://127.0.0.1:5173

      - name: Run Playwright tests
        working-directory: bloglist_e2e_tests
        run: npm test -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bloglist_e2e_tests/playwright-report
          if-no-files-found: ignore

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(toJson(github.event.commits), '#skip') }}
    steps:
      - name: Trigger deployment webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL configured. Skipping deploy trigger."
            exit 0
          fi

          curl -fsSL -X POST "$DEPLOY_HOOK_URL"
          echo "Deploy hook triggered."

  tag_release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(toJson(github.event.commits), '#skip') }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        with:
          tag_prefix: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify_success:
    name: Notify Success
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(toJson(github.event.commits), '#skip') && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.e2e.result == 'success' && needs.deploy.result == 'success' && needs.tag_release.result == 'success' }}
    needs: [backend, frontend, e2e, deploy, tag_release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about successful deployment
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Success
          title: "Deployment succeeded"
          description: |
            A new version was deployed from `${{ github.repository }}`.
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0x28a745
          username: GitHub Actions

  notify_failure:
    name: Notify Failure
    if: ${{ always() && (needs.backend.result == 'failure' || needs.frontend.result == 'failure' || needs.e2e.result == 'failure' || needs.deploy.result == 'failure' || needs.tag_release.result == 'failure') }}
    needs: [backend, frontend, e2e, deploy, tag_release]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord about pipeline failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: Failure
          title: "Build or deployment failed"
          description: |
            The pipeline failed in `${{ github.repository }}`.
            Branch: `${{ github.ref_name }}`
            Actor: `${{ github.actor }}`
            Commit: `${{ github.sha }}`
            Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xff0000
          username: GitHub Actions
